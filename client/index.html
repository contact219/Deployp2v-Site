<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#080C16" />

    <!-- Fonts: Bricolage Grotesque (display) + Inter (body) + JetBrains Mono (labels/counters) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Google Search Console: paste your verification code below, then remove
         these comment markers. Verification is NOT currently in place, which is
         why Search Console holds no data for this site.
         <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE" /> -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--seo:start-->
    <!-- Homepage defaults. In production server/seo.ts replaces this entire
         block per route so every page carries its own title, description and
         canonical. Never hard-code a single canonical outside this block — a
         site-wide canonical is what made every page look like a duplicate of
         the homepage and kept the blog and industry pages out of Google. -->
    <title>DeployP2V — The busywork runs itself now. | AI Automation for Small Business, Wylie TX</title>
    <meta name="description" content="DeployP2V (Possibility to Velocity): The busywork runs itself now. Done-for-you AI agents that answer calls, chase invoices, and follow up on every lead — live in 5–7 days, from $149/mo. Wylie, TX." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://deployp2v.com/" />
    <meta property="og:title" content="DeployP2V — The busywork runs itself now." />
    <meta property="og:description" content="DeployP2V (Possibility to Velocity): The busywork runs itself now. Done-for-you AI agents that answer calls, chase invoices, and follow up on every lead — live in 5–7 days, from $149/mo. Wylie, TX." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://deployp2v.com/" />
    <meta property="og:image" content="https://deployp2v.com/og-image.png" />
    <meta property="og:site_name" content="DeployP2V" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DeployP2V — The busywork runs itself now." />
    <meta name="twitter:description" content="Done-for-you AI agents that answer calls, chase invoices, and follow up on every lead — live in 5–7 days, from $149/mo. Wylie, TX." />
    <meta name="twitter:image" content="https://deployp2v.com/og-image.png" />
    <!--seo:end-->

    <!-- Site-wide structured data. Street address is deliberately omitted:
         DeployP2V publishes as a service-area business in Wylie, TX. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "DeployP2V",
      "alternateName": "DeployP2V — Possibility to Velocity",
      "description": "Done-for-you AI automation for small business: AI agents that answer calls, chase invoices, and follow up on every lead.",
      "slogan": "The busywork runs itself now.",
      "url": "https://deployp2v.com",
      "logo": "https://deployp2v.com/logo.png",
      "image": "https://deployp2v.com/og-image.png",
      "telephone": "+1-214-604-5735",
      "email": "tsparks@deployp2v.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Wylie",
        "addressRegion": "TX",
        "addressCountry": "US"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 33.0151,
        "longitude": -96.5383
      },
      "serviceArea": {
        "@type": "State",
        "name": "Texas"
      },
      "areaServed": ["Wylie", "Allen", "Plano", "McKinney", "Rockwall", "Murphy", "Dallas-Fort Worth", "Texas"],
      "priceRange": "$149-$499+",
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
        "opens": "00:00",
        "closes": "23:59"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "AI automation services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "AI agents and chatbots",
              "description": "Missed-call text back, website chat that books jobs, instant quotes and FAQ answers, every lead logged"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Workflow automation",
              "description": "Invoice chasing, review requests, appointment reminders, lead follow-up in 60 seconds"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Web development",
              "description": "Sites that book jobs, with booking and quote forms wired into your calendar and CRM"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "AI design and content",
              "description": "Logo and brand refresh, scheduled social posts, before/after job showcases, email campaigns"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Integrations",
              "description": "QuickBooks and CRM sync, calendar and booking apps, Stripe and Square payments, Google Sheets"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "IT solutions",
              "description": "Email and domain setup, backups, password and access cleanup, new-hire tech setup"
            }
          }
        ]
      },
      "makesOffer": {
        "@type": "Offer",
        "name": "Free 15-minute AI fit call",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
